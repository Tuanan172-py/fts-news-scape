# pipeline.yaml — Pipeline DAG Manifest (Spine 2)
#
# Khai báo máy-đọc-được của quy trình end-to-end. Article Lane là đường xử lý duy nhất
# từ 2026-09-23 (ADR 0010); chuỗi l1_route → l1_match → l1_ingest → gold_export →
# gold_analyze → gold_ingest đã gỡ. `pipeline_radar.py status` hiện thực vòng đời dưới
# đây và in đúng một lệnh kế tiếp.
#
# Mỗi stage tham chiếu agent theo `id` trong registry.yaml (không lặp lại io_boundary ở đây).
# needs: danh sách stage phụ thuộc (DAG edges).
# gate: cổng phải pass trước khi stage sau chạy.
# optional: true  -> stage draft/chưa kích hoạt, radar chỉ hiển thị "available".

version: 2
updated: "2026-09-23"
registry: .agents/registry.yaml

stages:

  - id: scrape
    agent: scraper-orchestrator
    class: operator
    needs: []
    produces: "articles + work_items (C:\\data\\news-scape\\monocle.db)"
    cli: '& "C:\venvs\news-scape\Scripts\python.exe" scripts/run_once.py'
    liveness_check: "max(fetched_at) trong articles <= 30 phút => 🟢"

  # ─────────── Article Lane — một agent, một bước cho cả lô ───────────
  - id: article_pack
    agent: article-packer
    class: operator
    needs: [scrape]
    produces: "data/agent_tasks/article/article_<wave>_NN.task.json + .map.json + wave_<wave>.json + wave_<wave>.conductor.ts"
    cli: '& "C:\venvs\news-scape\Scripts\python.exe" scripts/article_run.py --wave <wave> --date <YYYY-MM-DD> --limit <n> --batch 100'
    gate: "DB ghi được (preflight) + prefix khớp persona"
    note: >-
      Chọn bài chưa được mô hình phân tích (bản code-first không tính), xếp tầng ưu tiên
      theo hướng nhận rộng, đọc trọn nội dung, ghi packet sao cho mọi dòng nằm dưới trần cắt
      dòng của công cụ đọc, in dự toán để người dùng tham khảo.

  - id: article_analyze
    agent: article-processor
    class: cognitive
    needs: [article_pack]
    consumes: "data/agent_tasks/article/article_<wave>_*.task.json"
    produces: "data/agent_outputs_article/article_<wave>_*.output.json"
    wave: { batch: 100,
            note: "Một lệnh run_code cho cả đợt: đọc hết packet, hâm cache, mọi lô song song. Chia lô chỉ theo --batch." }
    invoke: "tools.agent_article trong MỘT lệnh run_code; chương trình wave_<wave>.conductor.ts do article_run.py sinh sẵn"
    repair: '& "C:\venvs\news-scape\Scripts\python.exe" scripts/article_run.py --wave <wave> --repair'

  - id: article_expand
    agent: article-expander
    class: operator
    needs: [article_analyze]
    produces: "l1_outputs + agent_outputs (qua l1-ingest-gate, gold-ingest-gate) + token_ledger + HANDOFF-latest.md"
    cli: '& "C:\venvs\news-scape\Scripts\python.exe" scripts/article_run.py --wave <wave> --finish'
    gate: "nạp không lỗi + độ phủ của đợt >= 90% ở cả hai lớp → mới in ✅ và thoát 0"
    note: >-
      Bung bản ghi của đúng đợt, dựng trích dẫn nguyên văn từ chỉ số đoạn, đối chiếu hai
      nguồn nhận diện, nạp qua hai cổng DoD chỉ với tệp của đợt, hậu kiểm theo tập bài
      của đợt, ghi sổ cái token (chỉ ghi nhận) và sinh tệp bàn giao.

  # ─────────── Cổng đặc nhiệm tùy chọn (draft) ───────────
  - id: story_dedup
    agent: story-dedup-clusterer
    class: cognitive
    needs: [article_expand]
    optional: true
    gate: dod-gatekeeper#dedup
    intent: "Gộp cùng sự kiện đa nguồn, gán N nguồn."

  - id: gold_qa
    agent: adversarial-dod-verifier
    class: cognitive
    needs: [article_expand]
    optional: true
    gate: dod-gatekeeper#verifier
    intent: "QA ngữ nghĩa trên mẫu output đã nạp; nạp defect vào harness backlog."

  - id: deliver
    agent: delivery-writer
    class: operator
    needs: [article_expand]
    produces: "users/output/<user>/<date>.xlsx"
    cli: '& "C:\venvs\news-scape\Scripts\python.exe" scripts/write_user_output.py --date <YYYY-MM-DD|today>'

  - id: daily_brief
    agent: daily-brief-synthesizer
    class: cognitive
    needs: [deliver]
    optional: true
    gate: dod-gatekeeper#brief
    intent: "Tổng hợp cuối ngày theo watchlist từng user."

# ─────────────── Vòng quản trị (chạy độc lập, không trên đường giao hàng) ───────────────
governance_loop:
  - id: harness_audit
    agent: harness-auditor
    class: cognitive
    optional: true
    trigger: "cuối phiên / sau mỗi đợt"
    reads: ["harness.db (trace + backlog + agent_metrics + token_ledger)", "mã nguồn (chỉ đọc)"]
    produces: "docs/proposals/harness_improvement_<date>.md"
    cli_readonly: '& "C:\venvs\news-scape\Scripts\python.exe" scripts/harness_cli.py propose'

# ─────────────── Bất biến điều phối (Conductor phải tuân) ───────────────
invariants:
  - "WIP=1: không 2 story in_progress đồng thời (AGENTS.md §1)."
  - "Một đợt tại một thời điểm: đợt gần nhất chưa xong (radar báo lệnh của đợt) thì không mở đợt mới."
  - "Một đợt = một lệnh run_code; không tách chương trình điều phối thành nhiều bước."
  - "Token là số ghi nhận, không phải cổng: không trần, không ngưỡng cảnh báo theo bài, lô hay đợt."
  - "No Script Emulation: cấm dùng regex/heuristic thay cognitive agent (rule 05 §3)."
  - "Đợt chỉ xong khi --finish thoát 0 và in ✅; ❌ thì chạy đúng lệnh --only mà khung lỗi in ra."
