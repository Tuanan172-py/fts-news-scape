      ## Ví dụ mẫu

      Packet vào:

      ```json
      {"d":"2026-09-18","n":2,"a":[
      {"i":0,"t":"Hòa Phát báo lãi quý 3 tăng 25%, HRC hưởng lợi thuế chống bán phá giá",
       "p":["Tập đoàn Hòa Phát công bố lợi nhuận sau thuế quý 3 đạt 3.200 tỷ đồng, tăng 25% so với cùng kỳ.",
            "Sản lượng thép cuộn cán nóng HRC tăng 32%, biên lợi nhuận gộp mở rộng lên 14,1%.",
            "Ông Trần Đình Long cho biết thuế chống bán phá giá tạo dư địa tăng giá bán nội địa."]},
      {"i":1,"t":"VND: Báo cáo tình hình quản trị công ty 6 tháng đầu năm",
       "p":["VNDirect công bố báo cáo quản trị định kỳ, không ghi nhận thay đổi nhân sự cấp cao."]}]}
      ```

      Kết quả ra:

      ```json
      [{"i":0,"e":[["Hòa Phát","COM"],["HRC","AST"],["thuế chống bán phá giá","THM"],
        ["ông Trần Đình Long","PER"],["Vận tải đường bộ & đường sắt","IND"]],
        "s":"Hòa Phát đạt lợi nhuận sau thuế 3.200 tỷ đồng trong quý 3, tăng 25% so với cùng kỳ nhờ sản lượng HRC và biên lợi nhuận cải thiện.",
        "k":["Biên lợi nhuận gộp mở rộng lên 14,1% nhờ giá bán nội địa được thuế tự vệ hỗ trợ",
             "Sản lượng HRC tăng 32% cho thấy nhu cầu nội địa phục hồi"],
        "im":"Kết quả vượt kỳ vọng củng cố định giá ngắn hạn; cần theo dõi giá HRC quý 4 và tiến độ áp thuế chính thức.",
        "sn":"pos","ts":"today","c":[0,1]},
       {"i":1,"e":[["VND","TIC"]],
        "s":"VNDirect công bố báo cáo quản trị định kỳ 6 tháng, không có thay đổi nhân sự cấp cao.",
        "k":["Báo cáo mang tính tuân thủ nghĩa vụ công bố thông tin định kỳ"],
        "im":"Không có tác động tới định giá; giá trị chủ yếu nằm ở hồ sơ tuân thủ của doanh nghiệp.",
        "sn":"neu","ts":"arch","c":[0]}]
      ```

      Lưu ý trong ví dụ: ngành `Vận tải đường bộ & đường sắt` **không** xuất hiện nguyên
      văn trong bài, nhưng vẫn phát vì nhận ra được từ ngữ cảnh, và phát đúng tên chuẩn.
      Đó là phần giá trị mà chỉ bạn làm được.

      ## Nhắc lại lần cuối

      Không tool. Không chương trình. Không đọc tệp. Một mảng JSON trong thông điệp cuối.

      ---

      <!-- ánh xạ loại sang tiền tố định danh: ASSET_CLASS->ASSET_CLASS, ETF->ETF, EXCHANGE->EXCHANGE, INDEX->INDEX, INDUSTRY_GICS1->IND_GICS1, INDUSTRY_GICS2->IND_GICS2, INDUSTRY_GICS3->IND_GICS3, INSTITUTION->INSTITUTION, MACRO_GEO->MACRO_GEO, MACRO_THEME->MACRO_THEME, SECURITY_OTHER->SECURITY_OTHER, TICKER->TICKER -->
    agentOptions:
      provider: deepseek-official
      model: deepseek-flash
      reasoningEffort: "off"      # settings.yaml đang để 'high' cho mọi con — phải đè ở đây
      # KHÔNG đặt `maxTokens` ở đây. Token là số ghi nhận, không phải trần.
      #
      # Trước đây để 40000. Đó là trần do chính dự án đặt, không phải trần của nhà
      # cung cấp, và nó chính là thứ đã cắt cụt lô 100 bài — buộc phía điều phối
      # phải chữa cháy bằng mười lượt mười bài ở đợt W1 và W2. Đặt một con số ở đây
      # là tự áp trần lên chính mình rồi đi thiết kế kiến trúc quanh cái trần ấy.
      #
      # Bỏ trống thì kế thừa mặc định của DSH: `DEFAULT_MAX_TOKENS = 256e3`, tức
      # 256.000 token mỗi request (xem docs/proposals/dsh-surface-verified-
      # 2026-09-18.md §6.1). Một đợt trăm bài cần khoảng 90.000, còn dư gần ba lần.
      #
      # Thiếu bài thì `article_run.py --wave <mã> --repair` đóng gói lại đúng phần
      # thiếu, không cần chia nhỏ mọi lô để phòng xa.
    toolFilter:
      allow: []                 # xem sự thật #2: còn lại run_code với SDK rỗng
    maxDepth: 1                 # xem sự thật #1
    backgroundMode: one-shot

# Hai row `agent_l1`/`agent_gold` của lane L1/Gold cũ đã gỡ ngày 2026-09-23 (ADR 0010).
# Article Lane là đường duy nhất; `agent_article` ở trên là agent con duy nhất.

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── presentation ────────────────────────────────────────────────────────────
#
# BẤT BIẾN KIẾN TRÚC — KHÔNG ĐỔI SANG `native`.
#
# Dưới `ptc`, kết quả của sub-call chỉ đi vào `tool/ptc-dispatch` trong log bền, KHÔNG
# vào context của Conductor; chỉ những gì chương trình `print`/`return` mới vào. Dưới
# `native` thì kết quả con vào thẳng context cha — nghĩa là mỗi batch sẽ đổ ~30.000 token
# JSON vào Conductor, làm sống lại đúng lớp đốt token mà toàn bộ kiến trúc này chữa.
#
# Vì con KHÔNG đặt được `mode` riêng (schema row subagent không có khoá đó), dòng này
# quyết định mode của cả Conductor lẫn mọi agent con.
#
# Neo: plans/20260918-1651-article-lane-unified/plan.md §4.2 R1.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc