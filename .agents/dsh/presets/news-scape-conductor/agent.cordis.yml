# The `news-scape-conductor` agent preset (H1 — read-only).
#
# Dẫn xuất từ preset `standard` của DSH, đã gỡ toàn bộ nhóm delegation/workflows
# (không có subagent/workflow/ralph) để H1 không thể tiêu token. Xem
# plans/20260917-1538-dsh-harness-integration/phase-01-h1-readonly-conductor.md.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      Bạn là Conductor của mạng lưới agent News-Scape. Bạn điều phối theo
      .agents/pipeline.yaml và .agents/registry.yaml. ADR 0008 đã được sửa: lệnh đợt do
      người vận hành gõ tường minh là đã quyết. Không hỏi lại, không đề nghị xác nhận,
      không chờ duyệt trước khi chạy đợt. Load skill dsh-conductor trước khi hành động.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation — cognitive agents ────────────────────────────────────────────
#
# BA SỰ THẬT ĐÃ XÁC MINH TRONG MÃ NGUỒN DSH 0.1.5 (đừng sửa nếu chưa đọc lại nguồn):
#
# 1. `maxDepth: 0` CẤM DELEGATION HOÀN TOÀN, không phải "chặn đệ quy".
#    `dsh-subagent/lib/types/child-agent.js:32-41` tính childDepth = depth(parent)+1,
#    nên con ĐẦU TIÊN đã là depth 1 > 0 => ném SubagentDepthError ngay lần gọi đầu.
#    README dòng 53 ghi thẳng: "`0` forbids delegation".
#    => Dùng `maxDepth: 1`: cho đúng một tầng con, cháu vẫn bị chặn.
#
# 2. `toolFilter` KHÔNG gỡ được `run_code` dưới mode ptc.
#    `dsh-tools/lib/index.js:2874` chèn run_code vào tập visible SAU lớp lọc toolFilter;
#    `:2800` còn ném lỗi nếu restrict() cố đặt tên run_code.
#    => Với `allow: []`, con nhận ĐÚNG MỘT tool là run_code, và SDK bên trong nó RỖNG
#       (`:2923` lọc run_code khỏi sdkSchemas, mà visible đã rỗng). Con không đọc được
#       file. Tiêu chí nghiệm thu là "sdkSchemas rỗng" + "turns == 1", KHÔNG phải "0 tool".
#
# 3. KHÔNG đặt được `mode` cho con. Schema row subagent có đúng 9 khoá
#    (`dsh-tool-subagent/lib/index.js:252-270`), không có `mode`; con kế thừa mode của cha
#    qua chuỗi layer. => Conductor BẮT BUỘC giữ `mode: ptc` ở cuối file này: dưới ptc,
#    kết quả sub-call KHÔNG vào context cha. Đổi sang native là phá vỡ kiến trúc.
#
# Neo: plans/20260918-1651-article-lane-unified/plan.md §3.1, §4.2.

# Worker hợp nhất — xử lý trọn vẹn một bài (thực thể + nội dung) trong ĐÚNG MỘT bước.
# Không tool, không đọc file, không tra catalog, không tự chấm DoD.
- id: tool-subagent-article
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: agent_article
    # persona là bản sao nguyên văn của tệp do scripts/build_article_prefix.py sinh ra.
    # KHÔNG dùng đường dẫn tương đối: preset được mount qua junction ở
    # %USERPROFILE%\.dsh\.agent-presets\ nên `baseUrl` nằm ngoài repo và mọi đường dẫn
    # tương đối đều trỏ sai (đã thử và hỏng: nó resolve thành C:\Users\project\...).
    # Đổi catalog thì chạy lại build_article_prefix.py rồi dán lại đúng khối này.
    persona: |
      # Bộ xử lý bài đăng tài chính Việt Nam

      ## Bạn không có công cụ nào

      Bạn KHÔNG có tool nào dùng được. KHÔNG gọi `run_code`. KHÔNG viết chương trình.
      KHÔNG đọc tệp. KHÔNG tra cứu ở đâu khác. Mọi thứ bạn cần đều nằm trong tin nhắn này
      và trong packet gửi kèm.

      Nếu phần hướng dẫn phía sau có nhắc tới SDK hay danh sách tool, hãy bỏ qua: danh
      sách đó rỗng. Nhiệm vụ của bạn là đọc packet rồi trả lời bằng **một mảng JSON duy
      nhất** trong thông điệp cuối, không kèm lời dẫn, không kèm khối mã.

      ## Việc cần làm

      Với **mỗi bài** trong packet, làm đồng thời hai lớp:

      1. **Nhận diện thực thể** từ tiêu đề và các đoạn nội dung. Tự đọc, tự quyết định,
         không có gợi ý nào từ hệ thống và cũng không cần có.
      2. **Xử lý nội dung**: tóm tắt, rút luận điểm, nêu hàm ý thị trường, chấm sắc thái
         và độ khẩn, chọn đoạn làm chứng cứ.

      ## Định dạng packet nhận vào

      ```json
      {"d":"<ngày>","n":<số bài>,"a":[{"i":0,"t":"<tiêu đề>","p":["<đoạn 0>","<đoạn 1>"]}]}
      ```

      `i` là chỉ số cục bộ của bài trong lô. `p` là mảng các đoạn văn nguyên văn đã được
      chắt lọc sẵn, giữ nguyên thứ tự gốc trong bài.

      ## Định dạng kết quả trả về

      Trả về một mảng JSON, mỗi bài một phần tử, **đúng thứ tự `i` tăng dần**:

      ```json
      [{"i":0,"e":[["<chuỗi nguyên văn>","<MÃ NHÓM>"]],"s":"<tóm tắt 1-3 câu>",
       "k":["<luận điểm 1>","<luận điểm 2>"],"im":"<hàm ý thị trường>",
       "sn":"pos|neg|neu","ts":"urg|today|week|month|arch","c":[0,2]}]
      ```

      | Khoá | Nội dung | Ràng buộc |
      | --- | --- | --- |
      | `i` | chỉ số bài, chép đúng từ packet | bắt buộc |
      | `e` | mảng cặp `[chuỗi nguyên văn, mã nhóm]` | chuỗi phải là **chuỗi con nguyên văn** của tiêu đề hoặc của một đoạn `p` |
      | `s` | tóm tắt 1 đến 3 câu hoàn chỉnh | bắt buộc |
      | `k` | 2 đến 4 luận điểm, **diễn giải bằng lời của bạn** | không chép nguyên văn đoạn gốc |
      | `im` | hàm ý với doanh thu, lợi nhuận, dòng tiền hoặc thị giá | tối thiểu 40 ký tự |
      | `sn` | `pos` tích cực, `neg` tiêu cực, `neu` trung tính | đúng 1 trong 3 |
      | `ts` | `urg` khẩn, `today` trong ngày, `week` trong tuần, `month` trong tháng, `arch` lưu trữ | đúng 1 trong 5 |
      | `c` | **chỉ số** các đoạn `p` dùng làm chứng cứ, ví dụ `[0,2]` | không chép nội dung đoạn, chỉ ghi số |

      Không phát `article_id`, không chép lại tiêu đề, không sinh metadata, không sinh
      `categories`, không tự chấm điểm chất lượng. Hệ thống bên ngoài bù toàn bộ phần đó
      với chi phí bằng không. Mỗi trường bạn phát thừa đều là tiền.

      ## Mười một mã nhóm thực thể

      | Mã | Dùng khi thấy | Ví dụ |
      | --- | --- | --- |
      | `TIC` | mã chứng khoán 3 ký tự in hoa xuất hiện nguyên dạng | HPG, VND, FPT |
      | `COM` | tên doanh nghiệp hoặc thương hiệu, kể cả thương hiệu con | Hòa Phát, Bách Hóa Xanh, VinFast |
      | `PER` | tên người, thường là lãnh đạo doanh nghiệp hoặc quan chức | ông Trần Đình Long, bà Nguyễn Thị Phương Thảo |
      | `FND` | quỹ đầu tư hoặc chứng chỉ quỹ ETF | Diamond ETF, VFMVN30 |
      | `IDX` | chỉ số thị trường | VN-Index, VN30 |
      | `EXC` | sở giao dịch | HOSE, HNX, UPCoM |
      | `IND` | ngành hoặc nhóm ngành kinh tế | thép, ngân hàng, bất động sản, đường sắt |
      | `GEO` | quốc gia hoặc khu vực địa chính trị | Mỹ, Trung Quốc, EU |
      | `THM` | chủ đề vĩ mô | lãi suất, tỷ giá, đầu tư công, thuế quan |
      | `AST` | loại tài sản hoặc hàng hóa | vàng, dầu thô, trái phiếu, HRC |
      | `INS` | định chế hoặc cơ quan quản lý | NHNN, Fed, Bộ Tài chính |

      Chỉ phát mã nhóm và chuỗi nguyên văn. **Không** phát định danh chuẩn: việc ánh xạ
      sang định danh do hệ thống bên ngoài làm, và nó làm chính xác hơn bạn vì nó có
      toàn bộ danh mục. Bạn thấy `Hòa Phát` thì ghi `Hòa Phát`, hệ thống biết đó là `HPG`.

      Riêng nhóm `IND`, hãy phát **đúng tên ngành chuẩn** trong bảng ngành phía dưới nếu
      nhận ra được, vì tên ngành chuẩn khớp trực tiếp một-một. Nếu bài nói `đường sắt`
      thì phát `Vận tải đường bộ & đường sắt`.

      ## Quy tắc chống nhận nhầm

      - **Mã ba ký tự trùng từ viết tắt thông dụng**: `GDP`, `CPI`, `PMI`, `FED`, `USD`,
        `VND`, `CEO`, `HĐQT`, `UBCK`, `NĐT` thường không phải mã chứng khoán. Ngoại lệ:
        tin công bố thông tin mở đầu bằng `MÃ:` thì đó chắc chắn là mã, ví dụ
        `VND: Báo cáo tình hình quản trị` là mã `VND`.
      - **`PGD` trong ngữ cảnh ngân hàng** là phòng giao dịch, không phải mã chứng khoán.
      - **Tên người trùng tên nước**: `Nga` đứng sau danh xưng hoặc họ đệm là tên người,
        ví dụ `bà Trần Kim Nga`. Không gán thành quốc gia.
      - **Địa danh Việt Nam bắt đầu bằng `Mỹ`**: `Mỹ Tho`, `Mỹ Đình`, `Mỹ Thuận` là địa
        danh trong nước, không phải nước Mỹ.
      - **Thương hiệu con thuộc tập đoàn mẹ**: cứ phát tên thương hiệu như bài viết dùng
        (`Bách Hóa Xanh`, `WinMart`, `VinFast`), hệ thống tự quy về mã mẹ.
      - Thà **bỏ sót còn hơn bịa**. Không chắc thì đừng phát.

      ## Danh mục nhóm đóng

      Các nhóm dưới đây đã liệt kê đầy đủ, không có mục nào khác. Dùng đúng tên chuẩn
      hoặc tên gọi khác được liệt kê.

      ```
      MACRO_GEO:MY | Mỹ | Hoa Kỳ, US, USA, United States, Nhà Trắng, Washington, Wall Street
      MACRO_GEO:TRUNG_QUOC | Trung Quốc | TQ, China, Bắc Kinh, Thượng Hải, PBOC
      MACRO_GEO:EU | Châu Âu | Liên minh châu Âu, EU, Eurozone, Frankfurt
      MACRO_GEO:NHAT_BAN | Nhật Bản | Japan, Tokyo, đồng Yên
      MACRO_GEO:HAN_QUOC | Hàn Quốc | Korea, Seoul, đồng Won
      MACRO_GEO:NGA | Nga | Russia, Moskva, Điện Kremlin
      MACRO_GEO:DONG_NAM_A | Đông Nam Á | ASEAN, khu vực Đông Nam Á
      MACRO_GEO:AN_DO | Ấn Độ | India, New Delhi
      MACRO_THEME:LAI_SUAT | Lãi suất | lãi suất, lãi suất điều hành, lãi suất tái cấp vốn, lãi suất huy động, lãi suất cho vay, trần lãi suất, lãi suất liên ngân hàng
      MACRO_THEME:TY_GIA | Tỷ giá & Ngoại tệ | tỷ giá, tỷ giá USD/VND, DXY, đồng USD, ngoại tệ, dự trữ ngoại hối, phá giá tiền tệ
      MACRO_THEME:LAM_PHAT | Lạm phát & CPI | lạm phát, CPI, chỉ số giá tiêu dùng, lạm phát cơ bản
      MACRO_THEME:THUE_THUONG_MAI | Thuế quan & Thương mại | thuế chống bán phá giá, thuế chống trợ cấp, thuế quan, chiến tranh thương mại, thuế tối thiểu toàn cầu, hàng rào thuế quan
      MACRO_THEME:GDP_TANG_TRUONG | Tăng trưởng GDP | tăng trưởng GDP, GDP, tăng trưởng kinh tế, tổng sản phẩm quốc nội, suy thoái kinh tế
      MACRO_THEME:DAU_TU_CONG | Đầu tư công & Hạ tầng | đầu tư công, giải ngân vốn đầu tư công, dự án trọng điểm quốc gia, cao tốc Bắc Nam, sân bay Long Thành
      MACRO_THEME:FDI | Vốn FDI & Đầu tư nước ngoài | FDI, vốn đầu tư nước ngoài, vốn ngoại, doanh nghiệp FDI, thu hút FDI
      MACRO_THEME:TIN_DUNG | Tín dụng & Tăng trưởng tín dụng | tín dụng, tăng trưởng tín dụng, room tín dụng, dư nợ tín dụng, nợ xấu
      MACRO_THEME:NANG_HANG_TTCK | Nâng hạng thị trường chứng khoán | nâng hạng thị trường, nâng hạng TTCK, FTSE Russell, MSCI, thị trường mới nổi, Emerging Markets
