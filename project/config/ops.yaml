# ops.yaml — tham số vận hành tự chủ khi máy mở (ADR 0012, sửa đổi 2026-10-01). Không chứa bí mật.
# Bí mật (Telegram, healthchecks) nằm ở C:\data\news-scape\secrets\ops.env hoặc biến môi trường.
# Mô hình vận hành: máy mở thì daemon chạy; máy ngủ/tắt thì mọi thứ dừng và bài nằm chờ.

sensor:
  interval_seconds: 120          # chu kỳ đánh giá điều kiện mở đợt
  threshold: 100                 # T1: đủ bấy nhiêu bài chờ thì mở đợt (thay ngưỡng 50 của article_tick)
  max_age_minutes: 90            # T2: bài chờ lâu nhất vượt mức này thì vét
  age_rule_hours: [6, 22]        # T2 chỉ áp trong khung giờ này; ban đêm chỉ T1
  flush_windows: ["07:15-07:45", "08:15-08:40", "12:15-12:45", "15:15-15:45", "17:15-17:45"]   # T3; mỗi khung đứng ngay trước một khung research_publish
  lookback_days: 3               # phạm vi tự động: hôm nay + N ngày trước (đủ phủ cuối tuần); bài không có ngày đăng tính theo ngày cào
  backlog:                       # T4: xử lý tồn đọng ngoài phạm vi, ngày mới nhất trước, bỏ qua bài mỏng
    enabled: true
    hours: [19, 7]               # khung giờ chạy, qua nửa đêm; ban ngày dành cho tin mới
    weekend_all_day: true
    pick_every_seconds: 120      # khoảng tối thiểu giữa hai lần chọn ngày tồn đọng

wave:
  runner: agy
  limit: 100
  batch: 50
  concurrency: 2
  max_repair_rounds: 2
  max_attempts_per_article: 2    # bài đã vào đủ số đợt này mà vẫn chưa qua DoD thì không tự thử lại
  cooldown_minutes: 30           # nghỉ sau đợt hỏng không do provider; /run bỏ qua
  progress_silence_minutes: 25   # analyze im lặng quá mức này là treo
  min_free_gb: 5
  deadlines_minutes:
    preflight: 2
    prepare: 10                  # backlog T4 quét 2023..nay mất 200–300 s (18/11), 5 phút làm hỏng đợt
    analyze: 45
    repair: 25
    finish: 30                   # nạp DB không nhận lệnh dừng; deadline chỉ dành cho treo thật
    deliver: 10                  # xuất xlsx giao hàng sau DONE, best-effort, không lật DONE

autonomy:
  demote_after_failures: 2       # số đợt hỏng liên tiếp thì L1 về L0
  max_order_days: 30             # mandate (D-A): hạn tối đa, tự gia hạn khi hệ thống khoẻ
  renew_when_days_left: 7        # còn bấy nhiêu ngày thì xét tự gia hạn
  renew_min_clean_streak: 5      # điều kiện khoẻ: số đợt sạch liên tiếp tối thiểu

control_room:
  enabled: true                  # Phòng điều khiển, chỉ nghe 127.0.0.1
  port: 8787

improvement:
  max_per_week: 5                # trần số đề xuất cải tiến tự sinh mỗi tuần (D-E)

breaker:
  timeout_trip: 3
  timeout_open_minutes: 15
  network_trip: 3
  network_open_minutes: 10
  empty_trip: 2
  quota_open_minutes: 15        # điều chỉnh từ 300 xuống 15 phút: hạn mức tự hồi phục sau vài phút, tránh tê liệt 5h
  auth_open_minutes: 60          # lỗi đăng nhập: sau 60 phút cho một đợt thử lại (keyring agy có thể tự làm mới); bỏ trống = chỉ /reset tay

daemon:
  lock_grace_seconds: 45        # chờ tiến trình cũ nhả khoá khi khởi động lại bằng schtasks /End + /Run

heartbeat:
  interval_seconds: 60

watchdog:
  stale_minutes: 10              # nhịp tim cũ hơn mức này ở hai lần kiểm liên tiếp thì báo daemon chết

digest:
  times: ["08:00", "18:00"]

supervisor:
  manage_capture: true
  restart_backoff_seconds: [10, 30, 60, 120, 300]
  max_restarts: 5
  restart_window_minutes: 30

probes:
  capture_stale_minutes: 30
  capture_hours: [7, 22]
  dead_letter_alert_delta: 50
  yield:                         # sản lượng từng nguồn so với cùng khung giờ 10 ngày làm việc trước (ADR-0033)
    window_minutes: 120
    lookback_days: 10
    min_mean: 3
    z_threshold: -2.5
    hours: [8, 17]
  capture_channels:
    paused: {}                   # nguồn tự làm hỏng kênh đối soát; gỡ khi probe báo đối soát lại được (OPEN-ITEMS CAP-1)
      # baodautu.vn gỡ 2026-11-20: đối soát qua listing chuyên mục khi sitemap tháng hỏng (reconcile.collect_baodautu)

alerts:
  dedup_minutes: 30
  push_wave_info: false          # false: đợt bình thường chỉ vào bản tin; tin riêng chỉ khi ngoại lệ

telegram:
  poll_timeout_seconds: 25

publish:                         # xuất bản một chiều lên SharePoint (ADR 0020); đích là NEWS_SCAPE_PUBLISH_DIR
  enabled: true                  # bật sau khi người vận hành xác nhận quyền ghi trên thư mục đích
  hour: 1                        # xuất bản ngày hôm qua sau giờ này
  include_review: false          # không đồng bộ bản monocle_review_*.db (~2,7 GB) qua OneDrive (ADR-0023, tránh tràn quota SharePoint)
  keep_review_days: 7            # số bản review/monocle_review_<ngày>.db giữ lại ở đích khi bật include_review
  write_probe_interval_minutes: 360  # kiểm ghi .probe tối đa mỗi 6 giờ thay vì 60 giây để tránh tạo/xóa 1.440 lần/ngày trong OneDrive
  stale_hours: 26                # latest.json cũ hơn mức này thì probe báo đỏ

research_publish:                # production FRA - Data/news cho team Research (ADR-0030); đích là NEWS_SCAPE_RESEARCH_DB_DIR
  enabled: true                  # bật 2026-11-11 (người vận hành duyệt); cần biến môi trường đích và khởi động lại daemon
  slots:                         # giờ Việt Nam, áp dụng mọi ngày kể cả cuối tuần
    - {name: sang-som, at: "07:50"}            # bản tin sáng: tin đêm qua và thị trường thế giới
    - {name: truoc-ato, at: "08:45"}           # công bố thông tin trước ATO 9:00
    - {name: truoc-phien-chieu, at: "12:50"}   # tin phiên sáng, trước phiên chiều 13:00
    - {name: sau-phien, at: "15:50"}           # sau ATC 14:45 và thỏa thuận 15:00
    - {name: cuoi-ngay, at: "17:50"}           # đọc buổi tối, chuẩn bị phiên sau
  wait_wave_max_minutes: 15      # tới giờ mà đợt phân tích đang chạy thì chờ tối đa bấy nhiêu phút
  catchup_lookback_hours: 24     # máy tắt lỡ khung thì đẩy bù một lần khi mở lại, trong phạm vi này
  express:                       # đẩy ngoài khung khi có bài urgent vừa qua cổng
    enabled: true
    min_interval_minutes: 30
  stale_hours: 12                # latest.json production cũ hơn mức này thì probe báo đỏ
  urgent_alerts: true            # sau mỗi lần đẩy, gửi Telegram các câu chuyện urgent mới (ADR-0033)
