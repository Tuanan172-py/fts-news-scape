        - "đầu tư"
        - "rót vốn"
        - "báo lãi"
        - "báo lỗ"
        - "HĐQT"
        - "CEO"
        - "doanh nhân"
        - "tỷ phú"
        - "nhà máy"
        - "khởi công"
        - "dự án"
        - "xe điện"
        - "đường bay"
        # -- ngân hàng / tiền tệ --
        - "ngân hàng"
        - "tín dụng"
        - "lãi suất"
        - "tỷ giá"
        - "ngoại hối"
        - "nợ xấu"
        - "tiền tệ"
        # -- cơ quan quản lý / chính sách / sở ban ngành --
        - "chính phủ"
        - "thủ tướng"
        - "quốc hội"
        - "bộ tài chính"
        - "bộ công thương"
