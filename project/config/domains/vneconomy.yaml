name: vneconomy
enabled: true
method: vneconomy       # dedicated scraper: RSS list + full raw HTML capture (was: rss)
rate_limit: 3.0
timeout: 30
language: vi
rss:
  feeds:
    - {url: "https://vneconomy.vn/tin-moi.rss", name: "VnEconomy Tin mới"}          # firehose bắt hết
    - {url: "https://vneconomy.vn/chung-khoan.rss", name: "VnEconomy Chứng khoán"}
    - {url: "https://vneconomy.vn/tai-chinh.rss", name: "VnEconomy Tài chính"}
    - {url: "https://vneconomy.vn/thi-truong.rss", name: "VnEconomy Thị trường"}
    - {url: "https://vneconomy.vn/dau-tu.rss", name: "VnEconomy Đầu tư"}
    - {url: "https://vneconomy.vn/kinh-te-the-gioi.rss", name: "VnEconomy Kinh tế thế giới"}
    - {url: "https://vneconomy.vn/nhip-cau-doanh-nghiep.rss", name: "VnEconomy Doanh nghiệp"}
    - {url: "https://vneconomy.vn/dia-oc.rss", name: "VnEconomy Bất động sản"}
detail:
  extract_full: true
  content_selector: "#article-editor"   # body biên tập (verified 2026-08-17, ổn định 3 section)
  max_details_per_cycle: 30
capture:
  raw_dir: "data/raw_html"       # RawStore lưu full raw HTML byte-exact + .meta.json
  min_body_bytes: 2048
compliance:
  respect_robots: true           # robots.txt: article cho phép, crawl-delay 1s cho AI bot
  proxy_rotation: false
  proxies: []
pitfalls: "content:encoded khai báo namespace nhưng item KHÔNG chứa (verified 2026-08-17) → detail-fetch bắt buộc. Detail server-rendered, body = #article-editor (thẻ <main>, không phải div). Img src trực tiếp trên premedia.vneconomy.vn (không lazy). h1 trang rỗng → dùng title RSS. pubDate RFC-2822 GMT → feedparser UTC-normalize. Không tag mã CK trong feed → tag_tickers theo watchlist."
