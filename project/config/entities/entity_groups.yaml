# entity_groups.yaml — Cấu hình NHÓM ĐỐI TƯỢNG cho lớp L3 agent.
#
# Mục đích: người dùng chỉ cần khai báo (bật) một nhóm hoặc liệt kê entity_id,
# lớp L3 sẽ nhận diện các thực thể tương ứng trong tin tức và trả về tin khớp
# đúng nhóm đã confirm.
#
# Cách chọn thực thể vào một nhóm (cộng dồn, union):
#   include_types    : chọn theo loại thực thể (TICKER, ETF, INDEX, EXCHANGE,
#                      INDUSTRY_GICS1/2/3, SECTOR_FPA, SECURITY_OTHER)
#   include_gics1    : chọn mọi TICKER thuộc ngành GICS cấp 1 (theo canonical_name)
#   include_sectors  : chọn thực thể SECTOR_FPA theo code (vd: Thep, Chungkhoan)
#   include_entities : liệt kê entity_id cụ thể (vd: TICKER:HPG)
#   exclude_entities : loại trừ entity_id khỏi nhóm
#
# Nguồn thực thể: data/entities/entities.json  (sinh bởi scripts/build_entities.py)

schema_version: "1.0.0"

groups:
  # ------- Ví dụ nhóm "FTA": thị trường & vĩ mô ---------------------------
  fta:
    label: "Nhóm FTA — thị trường & vĩ mô"
    description: >
      Quan tâm cổ phiếu theo nhóm ngành, thị trường chung, chỉ số, sàn giao dịch.
    include_types: [INDEX, EXCHANGE, INDUSTRY_GICS1, SECTOR_FPA]
    include_gics1: []          # vd: ["Tài chính"] -> mọi mã ngành Tài chính
    include_sectors: []        # vd: ["Chungkhoan", "Thep"]
    include_entities: []
    exclude_entities: []

  # ------- Ví dụ nhóm "cơ bản": doanh nghiệp -----------------------------
  co_ban:
    label: "Nhóm cơ bản — doanh nghiệp"
    description: >
      Quan tâm tên doanh nghiệp / mã cổ phiếu niêm yết (phân tích cơ bản).
    include_types: [TICKER]
    include_gics1: []
    include_sectors: []
    include_entities: []
    exclude_entities: []

  # ------- Ví dụ nhóm tuỳ biến: rổ bluechip theo dõi ---------------------
  watch_bluechip:
    label: "Bluechip theo dõi"
    description: "Ví dụ nhóm chỉ gồm một rổ mã cụ thể."
    include_types: []
    include_entities:
      - TICKER:HPG
      - TICKER:FPT
      - TICKER:VCB
      - TICKER:VNM
      - TICKER:MWG
