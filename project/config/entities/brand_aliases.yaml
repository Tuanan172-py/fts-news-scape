# brand_aliases.yaml — alias thương hiệu/thông dụng cho mã (bổ sung tay).
#
# Vì tên pháp lý (company_name.xlsx) thường KHÁC tên báo chí hay dùng
# (vd "Ngân hàng TMCP Ngoại thương Việt Nam" vs "Vietcombank"), map này bổ sung
# các surface form phổ biến để bước code-first bắt được nhiều hơn, giảm tải agent.
#
# Định dạng:  <TICKER>: [alias1, alias2, ...]   (alias ≥4 ký tự mới được index)
# Nạp bởi scripts/build_entities.py → gộp vào entities.json.

