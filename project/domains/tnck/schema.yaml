# Domain Schema Contract — TNCK / ĐTCK (tinnhanhchungkhoan.vn)
# Báo của Uỷ ban Chứng khoán Nhà nước. Mạnh về điều tra doanh nghiệp,
# tranh chấp cổ đông, pháp lý chứng khoán.

domain: tinnhanhchungkhoan.vn   # ← NON-WWW. Nguồn sự thật cho resolve_source_domain();
                                #   sửa bẫy cũ 'tnck' → 'tnck.vn' (không khớp gì trong DB).
method: api+capture             # zone JSON API (list) + full raw HTML capture (detail)
endpoint: "https://api.tinnhanhchungkhoan.vn/api/morenews-zone-{zone}-{page}.html"
last_verified: 2026-09-07

rss:
  exists: false
  note: >
    KHÔNG CÓ RSS. /rss.html = 200 nhưng 13 bytes rỗng; /rss/trang-chu.rss,
    /chung-khoan.rss, /rss/chung-khoan.rss = 302 + 0 byte. Đừng probe lại.

robots:
  www: >
    Allow: / ; Disallow: /api/ /search/ /tim-kiem/ /search.html /tim-kiem.html
    /tu-khoa.html /tag.html /print.html ; Sitemap: /sitemap.xml ; KHÔNG khai Crawl-delay
  api_host: >
    api.tinnhanhchungkhoan.vn là HOST KHÁC, robots riêng (200, rỗng).
    Disallow /api/ của www KHÔNG áp cho host này.
  articles: "/<slug>-post<NNN>.html — ĐƯỢC PHÉP"

pitfalls:
  - "`date` = epoch GIÂY, JSON NUMBER (docs cũ ghi 'string' — SAI, sửa 2026-09-07). int() nhận cả hai."
  - "`url` là relative → urljoin về https://www.tinnhanhchungkhoan.vn"
  - "`phrase` param BỊ SERVER IGNORE (phrase=HPG trả y hệt zone content) → không filter ticker được."
  - "source_domain = NON-WWW 'tinnhanhchungkhoan.vn' nhưng article.url GIỮ host www. Đổi URL sẽ đổi url_title_hash = đổi định danh bài."
  - "Quảng cáo div[id^=adsWeb_] nằm BÊN TRONG div.article__body → lọt vào Silver cleaned_text. Strip ở Silver nếu nhiễu; KHÔNG đụng Bronze (WORM)."

