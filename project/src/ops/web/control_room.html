<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng điều khiển News-Scape</title>
<style>
/* Layout: thanh đầu cố định (tên, màn, dải trạng thái), thân một cột; sơ đồ và bảng rộng cuộn ngang. */
:root {
  --bg: #f4f7f6; --surface: #ffffff; --fg: #17211e; --muted: #56655f; --line: #cdd9d4; --band: #eaf0ee;
  --accent: #0b7a64; --accent-soft: #d6efe8; --agy: #b4540b; --agy-soft: #fbe6d3;
  --warn: #8a5a00; --warn-soft: #f8ecc9; --bad: #b3261e; --bad-soft: #f8dcd9;
  --font: "Segoe UI", system-ui, -apple-system, "Be Vietnam Pro", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #151f1c; --fg: #e3ece9; --muted: #92a69f; --line: #2a3a35; --band: #121b18;
    --accent: #3ccaa9; --accent-soft: #123a31; --agy: #f2a05e; --agy-soft: #3a2412;
    --warn: #e9c05b; --warn-soft: #3a3014; --bad: #f28b82; --bad-soft: #3d1f1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151f1c; --fg: #e3ece9; --muted: #92a69f; --line: #2a3a35; --band: #121b18;
  --accent: #3ccaa9; --accent-soft: #123a31; --agy: #f2a05e; --agy-soft: #3a2412;
  --warn: #e9c05b; --warn-soft: #3a3014; --bad: #f28b82; --bad-soft: #3d1f1c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 20px 8px; }
.top { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
nav a:focus-visible, button:focus-visible, tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#strip { display: flex; gap: 6px 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--fg); font-weight: 700; }
.chip.ok { background: var(--accent-soft); border-color: var(--accent); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); }
main { max-width: 1180px; margin: 0 auto; padding: 20px; }
h2 { font-size: 15px; margin: 28px 0 10px; }
h2:first-child { margin-top: 0; }
h3 { font-size: 11px; margin: 0 0 6px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.scroll { overflow-x: auto; }
.pad { padding: 14px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }
code { font-family: var(--mono); font-size: 12px; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 7px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--band); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--band); } tr.sel td { background: var(--accent-soft); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--band); color: var(--muted); }
.pill.ok, .pill.DONE { background: var(--accent-soft); color: var(--accent); }
.pill.run, .pill.running, .pill.partial { background: var(--agy-soft); color: var(--agy); }
.pill.fail, .pill.FAILED, .pill.timeout { background: var(--bad-soft); color: var(--bad); }
.pill.parked, .pill.PARKED, .pill.warn { background: var(--warn-soft); color: var(--warn); }
.kind { font: 500 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--band); color: var(--muted); margin-right: 4px; }
.kind.agent { background: var(--agy-soft); color: var(--agy); } .kind.workflow { background: var(--accent-soft); color: var(--accent); }
.kind.gate { background: var(--warn-soft); color: var(--warn); }
button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button:disabled { opacity: .5; cursor: default; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
svg { display: block; color: var(--fg); }
svg .nd { fill: var(--surface); stroke: var(--muted); stroke-width: 1.3; }
svg .nd.cond { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg .nd.cognitive { fill: var(--agy-soft); stroke: var(--agy); stroke-width: 2; }
svg .nd.fail { stroke: var(--bad); stroke-width: 2.5; }
svg .nd.run { stroke: var(--agy); stroke-width: 3; }
svg .nd.draft { stroke-dasharray: 5 4; }
svg .nd.idle { opacity: .85; }
svg .store { fill: var(--band); stroke: var(--line); stroke-width: 1.3; }
svg .nid { font: 500 10.5px var(--mono); fill: var(--fg); text-anchor: middle; }
svg .nsub { font: 400 10.5px var(--font); fill: var(--muted); text-anchor: middle; }
svg .badge { font: 600 11px var(--font); fill: var(--agy); text-anchor: middle; }
svg .bus { stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; }
svg .flow { stroke: var(--fg); stroke-width: 1.6; fill: none; }
svg .flow.dashed { stroke: var(--muted); stroke-dasharray: 5 4; }
svg .dot.ok { fill: var(--accent); } svg .dot.run { fill: var(--agy); } svg .dot.fail { fill: var(--bad); }
svg .dot.idle, svg .dot.draft { fill: var(--muted); }
svg .lbl { font: 600 10px var(--font); letter-spacing: .1em; fill: var(--muted); }
svg .gbar { fill: var(--accent); } svg .gbar.agent { fill: var(--agy); } svg .gbar.fail, svg .gbar.timeout { fill: var(--bad); }
svg .gbar.partial { fill: var(--agy); opacity: .6; } svg .gbar.running { fill: var(--agy); } svg .gbar.skipped, svg .gbar.parked, svg .gbar.interrupted { fill: var(--muted); }
svg .gtxt { font: 11px var(--font); fill: var(--fg); }
svg .axis { stroke: var(--line); stroke-width: 1; } svg .axtxt { font: 10px var(--font); fill: var(--muted); }
@media (prefers-reduced-motion: no-preference) { svg .nd.run { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.spark { stroke: var(--accent); stroke-width: 2; fill: none; }
.kv { display: grid; grid-template-columns: 9em minmax(0,1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
ul.plain { margin: 0; padding-left: 1.1em; } ul.plain li { margin-bottom: 3px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Phòng điều khiển News-Scape</h1>
    <nav id="nav" aria-label="Màn hình">
      <a href="#overview" data-tab="overview">Toàn cảnh</a>
      <a href="#waves" data-tab="waves">Đợt</a>
      <a href="#agents" data-tab="agents">Tác nhân</a>
      <a href="#incidents" data-tab="incidents">Sự cố</a>
      <a href="#improve" data-tab="improve">Cải tiến</a>
    </nav>
  </div>
  <div id="strip" aria-live="polite"></div>
</header>
<main id="view"><div class="empty">Đang tải...</div></main>

<script>
const TOKEN = "__CR_TOKEN__";
const sel = { wave: null, agent: null, open: new Set() };
let timer = null, lastTab = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// FMT:BEGIN (khớp từng ký tự với src/ops/present.py; tests/test_ops_present.py kiểm bằng Node)
const fmtInt = n => (n == null || isNaN(n)) ? "–" : String(Math.floor(n + 0.5)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const fmtPct = r => (r == null) ? "–" : Math.floor(r * 100 + 0.5) + "%";
const fmtDuration = s => {
  if (s == null) return "–";
  const ms = Math.floor(s * 1000 + 0.5);
  if (ms < 1000) return ms + " ms";
  if (s < 10) { const tenths = Math.floor(s * 10 + 0.5) / 10; if (tenths < 10) return tenths.toFixed(1).replace(".", ",") + " s"; }
  const t = Math.floor(s + 0.5);
  if (t < 60) return t + " s";
  return Math.floor(t / 60) + " ph " + (t % 60) + " s";
};
const isIso = s => /^\d{4}-\d{2}-\d{2}/.test(s);
const fmtTime = iso => !iso ? "–" : !isIso(String(iso)) ? String(iso) : (String(iso).length >= 16 ? String(iso).slice(11, 16) : "–");
const fmtDate = iso => !iso ? "–" : !isIso(String(iso)) ? String(iso) : String(iso).slice(8, 10) + "/" + String(iso).slice(5, 7) + "/" + String(iso).slice(0, 4);
const fmtDateTime = iso => { if (!iso) return "–"; const s = String(iso); if (!isIso(s)) return s; const d = s.slice(8, 10) + "/" + s.slice(5, 7); return s.length < 16 ? d : d + " " + s.slice(11, 16); };
// FMT:END
const num = fmtInt, pct = fmtPct, dur = ms => ms == null ? "–" : fmtDuration(ms / 1000), hhmm = fmtTime;
let L = {};
const lab = (table, key) => (key == null || key === "") ? "–" : ((L[table] || {})[key] ?? String(key));
const pillText = s => { for (const t of ["level", "span_status", "wave_status", "breaker_state", "proposal_status", "agent_status"]) { const v = (L[t] || {})[s]; if (v !== undefined) return v; } return String(s); };
const pill = (s, cls) => `<span class="pill ${esc(cls || s)}">${esc(pillText(s))}</span>`;

async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
async function post(path) {
  const r = await fetch(path, { method: "POST", headers: { "X-CR-Token": TOKEN } });
  return { status: r.status, body: await r.json().catch(() => ({})) };
}

// ── dải trạng thái ───────────────────────────────────────────────────────────
function chip(k, v, cls) { return `<span class="chip ${cls || ""}">${esc(k)} <b>${esc(v)}</b></span>`; }
function renderStrip(s) {
  const d = s.daemon, m = s.mandate, p = s.pending, c = [];
  c.push(chip("daemon", d.alive ? "sống" : (d.heartbeat_age_s == null ? "chưa chạy" : "im lặng " + Math.round(d.heartbeat_age_s / 60) + " ph"), d.alive ? "ok" : "bad"));
  c.push(chip("cào tin", s.capture, s.capture === "child" || s.capture === "external" ? "ok" : "warn"));
  c.push(chip("mandate", m.exists ? m.level + (m.days_left != null ? " · còn " + m.days_left + " ngày" : "") : "L0 · chưa cấp", m.level === "L1" ? "ok" : "warn"));
  (s.breakers.length ? s.breakers : []).forEach(b => c.push(chip("breaker " + b.provider, b.state, b.state === "CLOSED" ? "ok" : "bad")));
  if (s.paused) c.push(chip("trạng thái", "tạm dừng", "warn"));
  if (s.kill_switch) c.push(chip("AGY_STOP", "BẬT", "bad"));
  c.push(chip("bài chờ", num(p.total) + (p.oldest_age_min ? " · lâu nhất " + Math.round(p.oldest_age_min) + "'" : "")));
  c.push(chip("tồn đọng cũ", num(p.backlog_all), "warn"));
  if (s.active_wave) c.push(chip("đang chạy", s.active_wave.wave_id + " " + s.active_wave.step, "warn"));
  c.push(chip("chuỗi sạch", s.streaks.clean + (s.streaks.fail ? " · hỏng " + s.streaks.fail : "")));
  if (s.alerts_unsent) c.push(chip("tin chưa gửi", s.alerts_unsent, "warn"));
  if (s.proposals_open) c.push(chip("đề xuất mở", s.proposals_open, "warn"));
  document.getElementById("strip").innerHTML = c.join("");
}

// ── Toàn cảnh ────────────────────────────────────────────────────────────────
function drawMap(map) {
  const W = map.width, H = map.height, byId = Object.fromEntries(map.nodes.map(n => [n.id, n]));
  const out = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bản đồ các agent trong registry với trạng thái hiện tại" style="width:100%;min-width:1000px;height:auto"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>`];
  const cond = byId["master-orchestrator"], chain = map.chain.map(i => byId[i]).filter(Boolean);
  if (cond && chain.length) {
    const busY = 150, cx = cond.x + cond.w / 2;
    out.push(`<line class="bus" x1="${cx}" y1="${cond.y + cond.h}" x2="${cx}" y2="${busY}"/>`);
    out.push(`<line class="bus" x1="${chain[0].x + chain[0].w / 2}" y1="${busY}" x2="${chain[chain.length - 1].x + chain[chain.length - 1].w / 2}" y2="${busY}"/>`);
    chain.forEach(n => out.push(`<line class="bus" x1="${n.x + n.w / 2}" y1="${busY}" x2="${n.x + n.w / 2}" y2="${n.y}"/>`));
  }
  map.edges.forEach(e => {
    const a = byId[e.from], b = byId[e.to]; if (!a || !b) return;
    out.push(`<line class="flow ${e.dashed ? "dashed" : ""}" x1="${a.x + a.w + 1}" y1="${a.y + a.h / 2}" x2="${b.x - 1}" y2="${b.y + b.h / 2}" marker-end="url(#ar)"/>`);
  });
  map.nodes.forEach(n => {
    const cls = ["nd", n.class === "conductor" ? "cond" : n.class === "cognitive" ? "cognitive" : "", n.state === "fail" ? "fail" : "", n.state === "run" ? "run" : "", n.state === "draft" ? "draft" : "", n.state === "idle" ? "idle" : ""].join(" ");
    const sub = (n.class === "cognitive" && n.status === "active") ? "cognitive · tools " + n.tools : n.class + (n.skill ? " · " + n.skill : "");
    out.push(`<g><title>${esc(n.id)}: ${esc(n.state)}</title><rect class="${cls}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7"/>`);
    out.push(`<circle class="dot ${n.state}" cx="${n.x + n.w - 11}" cy="${n.y + 11}" r="4.5"/>`);
    out.push(`<text class="nid" x="${n.x + n.w / 2}" y="${n.y + n.h / 2 - 2}">${esc(n.id)}</text>`);
    out.push(`<text class="nsub" x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + 14}">${esc(sub.length > Math.floor(n.w / 6) ? sub.slice(0, Math.floor(n.w / 6) - 1) + "…" : sub)}</text>`);
    const st = n.stats;
    if (st && st.spans) out.push(`<text class="badge" x="${n.x + n.w / 2}" y="${n.y + n.h + 17}">${st.spans} span${st.tokens ? " · " + num(st.tokens) + " token" : ""}${st.tool_violations ? " · vi phạm " + st.tool_violations : ""}</text>`);
    out.push(`</g>`);
  });
  out.push(`<text class="lbl" x="16" y="292">DRAFT, CHƯA VẬN HÀNH</text><line class="bus" x1="16" y1="362" x2="${W - 16}" y2="362"/>`);
  map.stores.forEach((s, i) => {
    const sw = (W - 32 - 40) / 3, x = 16 + i * (sw + 20);
    out.push(`<rect class="store" x="${x}" y="374" width="${sw}" height="40" rx="7"/><text class="nid" x="${x + sw / 2}" y="392">${esc(s.name)}</text><text class="nsub" x="${x + sw / 2}" y="407">${esc(s.sub)}</text>`);
  });
  out.push("</svg>");
  return out.join("");
}

async function viewOverview() {
  const [map, ws, kpi] = await Promise.all([api("/api/map"), api("/api/waves?limit=6"), api("/api/kpi")]);
  renderStrip(map.state);
  const an = kpi.anomalies.length
    ? `<ul class="plain">${kpi.anomalies.map(a => `<li><b>${esc(a.metric)}</b>: ${a.value} (trung bình 7 ngày ${a.mean} ± ${a.stdev})</li>`).join("")}</ul>`
    : `<div class="muted">Không có số đo nào lệch quá 2 độ lệch chuẩn so với các đợt trước${Object.values(kpi.series).every(s => s.length < 6) ? " (chưa đủ 5 đợt để so sánh)" : ""}.</div>`;
  const rows = ws.map(w => `<tr class="pick" tabindex="0" data-wave="${esc(w.wave_id)}"><td class="mono">${esc(w.wave_id)}</td><td>${pill(w.status)}</td><td class="num">${num(w.n_articles)}</td><td class="num">${pct(w.first_pass_yield)}</td><td class="num">${num(w.tokens)}</td><td class="num">${w.duration_s != null ? fmtDuration(w.duration_s) : "–"}</td></tr>`).join("");
  return `<h2>Bản đồ agent</h2><div class="panel scroll">${drawMap(map)}</div>
  <p class="note">Nút là agent trong <code>registry.yaml</code>, màu theo vết lúc chạy hôm nay. Cột cam là agent duy nhất tiêu token. Nút nét đứt là agent draft.</p>
  <div class="grid2"><div><h2>Đợt gần nhất</h2><div class="panel scroll"><table><thead><tr><th>Đợt</th><th>Trạng thái</th><th>Bài</th><th>Nhận đủ lượt đầu</th><th>Token</th><th>Thời gian</th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">Chưa có đợt nào do daemon chạy.</td></tr>`}</tbody></table></div></div>
  <div><h2>Khác thường</h2><div class="panel pad">${an}</div></div></div>`;
}

// ── Đợt: Gantt và cây vết ────────────────────────────────────────────────────
function depthMap(spans) {
  const by = Object.fromEntries(spans.map(s => [s.span_id, s])), memo = {};
  const d = s => memo[s.span_id] ?? (memo[s.span_id] = (s.parent_id && by[s.parent_id]) ? d(by[s.parent_id]) + 1 : 0);
  spans.forEach(d); return memo;
}
function ordered(spans) {
  const kids = {}; spans.forEach(s => (kids[s.parent_id || ""] ||= []).push(s));
  const ids = new Set(spans.map(s => s.span_id)), out = [];
  const walk = s => { out.push(s); (kids[s.span_id] || []).forEach(walk); };
  spans.filter(s => !s.parent_id || !ids.has(s.parent_id)).forEach(walk);
  return out;
}
function drawGantt(tr, rowsOrdered, depth) {
  const W = 1040, left = 230, rowH = 22, H = rowsOrdered.length * rowH + 30, T = Math.max(1, tr.duration_ms);
  const out = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ Gantt các span của đợt ${esc(tr.wave_id)}" style="width:100%;min-width:760px;height:auto">`];
  for (let i = 0; i <= 4; i++) { const x = left + (W - left - 10) * i / 4; out.push(`<line class="axis" x1="${x}" y1="14" x2="${x}" y2="${H - 4}"/><text class="axtxt" x="${x}" y="10" text-anchor="${i === 4 ? "end" : "start"}">${dur(T * i / 4)}</text>`); }
  rowsOrdered.forEach((s, i) => {
    const y = 20 + i * rowH, x = left + (W - left - 10) * s.offset_ms / T, w = Math.max(3, (W - left - 10) * s.duration_ms / T);
    const label = (s.kind === "agent" ? "" : "") + s.name;
    out.push(`<text class="gtxt" x="${8 + depth[s.span_id] * 12}" y="${y + 12}">${esc(label.length > 30 - depth[s.span_id] * 2 ? label.slice(0, 28 - depth[s.span_id] * 2) + "…" : label)}</text>`);
    out.push(`<rect class="gbar ${esc(s.kind === "agent" && s.status === "ok" ? "agent" : s.status)}" x="${x}" y="${y + 2}" width="${w}" height="${rowH - 7}" rx="3"><title>${esc(s.name)} · ${esc(s.status)} · ${dur(s.duration_ms)}</title></rect>`);
  });
  out.push("</svg>"); return out.join("");
}
function spanNote(s) {
  const a = s.attrs || {}, bits = [];
  if (a.received != null) bits.push(`nhận ${a.received}/${a.total}`);
  if (a.items != null && a.items_total != null) bits.push(`${a.items}/${a.items_total} bản ghi`);
  if (a.runner_status) bits.push(a.runner_status);
  if (a.articles != null) bits.push(a.articles + " bài");
  if (a.rc != null && a.rc !== 0) bits.push("rc=" + a.rc);
  if (a.attempts > 1) bits.push("thử " + a.attempts + " lần");
  if (a.reason) bits.push(String(a.reason).slice(0, 60));
  if (a.articles_cov != null) bits.push("phủ " + a.articles_cov);
  if (a.l1_coverage != null) bits.push(`phủ nhận diện ${pct(a.l1_coverage)} · nội dung ${pct(a.gold_coverage)}`);
  return bits.join(" · ");
}
function toolCell(s) {
  if (s.kind !== "agent") return "–";
  const a = s.attrs || {};
  return `${a.tool_invoked ? "<b style='color:var(--bad)'>CÓ gọi</b>" : "0 gọi"} · ${a.denied_actions ? "<b style='color:var(--bad)'>bị từ chối</b>" : "0 từ chối"}`;
}
function drawTree(rowsOrdered, depth) {
  return `<table><thead><tr><th>Span</th><th>Actor (registry)</th><th>Skill</th><th>Script / lệnh</th><th>Công cụ</th><th>Token</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody>${rowsOrdered.map(s => `<tr><td style="padding-left:${10 + depth[s.span_id] * 20}px;white-space:nowrap"><span class="kind ${esc(s.kind)}">${esc(s.kind)}</span> ${esc(s.name)}<div class="muted" style="font-size:11.5px">${esc(spanNote(s))}</div></td><td>${esc(s.actor_id || "–")}</td><td class="mono">${esc(s.skill || "–")}</td><td class="mono">${esc(s.entrypoint || "–")}</td><td class="mono">${toolCell(s)}</td><td class="num">${s.tokens ? num(s.tokens) : "–"}</td><td class="num">${dur(s.duration_ms)}</td><td>${pill(s.status)}</td></tr>`).join("")}</tbody></table>`;
}
async function viewWaves() {
  const ws = await api("/api/waves?limit=30");
  if (!sel.wave && ws.length) sel.wave = ws[0].wave_id;
  let detail = `<div class="empty">Chọn một đợt để xem cây vết.</div>`;
  if (sel.wave) {
    const tr = await api("/api/trace/" + encodeURIComponent(sel.wave));
    if (tr.spans.length) {
      const dp = depthMap(tr.spans), ord = ordered(tr.spans);
      detail = `<h2>Biểu đồ Gantt · ${esc(sel.wave)} · ${dur(tr.duration_ms)}</h2><div class="panel scroll pad">${drawGantt(tr, ord, dp)}</div>
      <h2>Cây vết</h2><div class="panel scroll">${drawTree(ord, dp)}</div>`;
    } else detail = `<div class="panel empty">Đợt ${esc(sel.wave)} chưa có span nào. Vết chỉ được ghi cho đợt chạy qua daemon từ khi bật US-031.</div>`;
  }
  const rows = ws.map(w => `<tr class="pick ${w.wave_id === sel.wave ? "sel" : ""}" tabindex="0" data-wave="${esc(w.wave_id)}"><td class="mono">${esc(w.wave_id)}</td><td>${pill(w.status)}</td><td>${fmtDate(w.target_date)}</td><td class="num">${num(w.n_articles)}</td><td class="num">${pct(w.first_pass_yield)}</td><td class="num">${pct(w.repair_share)}</td><td class="num">${num(w.tokens)}</td><td class="num">${w.duration_s != null ? fmtDuration(w.duration_s) : "–"}</td><td>${esc(w.trigger)}</td></tr>`).join("");
  return `<h2>Các đợt</h2><div class="panel scroll"><table><thead><tr><th>Đợt</th><th>Trạng thái</th><th>Ngày bài</th><th>Bài</th><th>Nhận đủ lượt đầu</th><th>Tỷ lệ token ở bước vá</th><th>Token</th><th>Thời gian</th><th>Mở bởi</th></tr></thead><tbody>${rows || `<tr><td colspan="9" class="empty">Chưa có đợt nào.</td></tr>`}</tbody></table></div>${detail}`;
}

// ── Tác nhân ─────────────────────────────────────────────────────────────────
async function viewAgents() {
  const list = await api("/api/agents");
  if (!sel.agent) sel.agent = "article-processor";
  const order = { conductor: 0, operator: 1, cognitive: 2 };
  const shown = list.filter(a => a.status !== "retired").sort((a, b) => (order[a.class] - order[b.class]) || a.id.localeCompare(b.id));
  const rows = shown.map(a => `<tr class="pick ${a.id === sel.agent ? "sel" : ""}" tabindex="0" data-agent="${esc(a.id)}"><td class="mono">${esc(a.id)}</td><td>${esc(a.class)}</td><td>${pill(a.status, a.status === "active" ? "ok" : "warn")}</td><td class="mono">${esc(a.skill || "–")}</td><td class="mono">${esc(a.model || "–")}</td></tr>`).join("");
  const card = sel.agent ? await api("/api/agent/" + encodeURIComponent(sel.agent)).catch(() => null) : null;
  let detail = "";
  if (card) {
    const sp = card.spec, io = sp.io_boundary || {};
    const trend = card.trend.length ? `<table><thead><tr><th>Ngày</th><th>Span</th><th>Thành công</th><th>Token</th><th>Độ trễ TB</th></tr></thead><tbody>${card.trend.map(t => `<tr><td>${esc(t.day)}</td><td class="num">${t.spans}</td><td class="num">${pct(t.spans ? t.ok / t.spans : null)}</td><td class="num">${num(t.tokens)}</td><td class="num">${t.avg_latency_s != null ? t.avg_latency_s + " s" : "–"}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Chưa có span nào của tác nhân này trong 7 ngày.</div>`;
    const recent = card.recent.length ? `<table><thead><tr><th>Span</th><th>Đợt</th><th>Trạng thái</th><th>Token</th><th>Lúc</th></tr></thead><tbody>${card.recent.map(r => `<tr class="pick" tabindex="0" data-wave="${esc(r.trace_id)}"><td>${esc(r.name)}</td><td class="mono">${esc(r.trace_id)}</td><td>${pill(r.status)}</td><td class="num">${r.tokens ? num(r.tokens) : "–"}</td><td class="num">${hhmm(r.started_at)}</td></tr>`).join("")}</tbody></table>` : "";
    detail = `<h2>${esc(sp.id)} ${pill(sp.status, sp.status === "active" ? "ok" : "warn")}</h2>
    <div class="grid2"><div class="panel pad"><h3>Đặc tả từ registry</h3><dl class="kv">
      <dt>Loại</dt><dd>${esc(sp.class)}</dd><dt>Mô hình</dt><dd>${esc(sp.model || "không dùng LLM")}</dd>
      <dt>Skill</dt><dd class="mono">${esc(sp.skill || "–")}</dd><dt>Entrypoint</dt><dd class="mono">${esc(sp.entrypoint || sp.cli || "–")}</dd>
      <dt>Công cụ cho phép</dt><dd>${(sp.tools_allowed || []).length ? esc(sp.tools_allowed.join(", ")) : "không có (0)"}</dd>
      <dt>Đọc</dt><dd class="mono">${io.read ? esc(io.read.join("; ") || "không có (agent không đọc tệp)") : "–"}</dd><dt>Ghi</dt><dd class="mono">${io.write ? esc(io.write.join("; ") || "không có (kết quả trả trong thông điệp)") : "–"}</dd>
      <dt>Cổng DoD</dt><dd>${esc(sp.dod_contract || "–")}</dd><dt>KPI</dt><dd>${esc((sp.kpis || []).join(", ") || "–")}</dd></dl>
      <p class="note">${esc(String(sp.responsibility || sp.intent || "").replace(/\s+/g, " ").slice(0, 320))}</p></div>
    <div class="panel pad"><h3>Bất biến</h3><ul class="plain">${(sp.invariants || []).slice(0, 7).map(i => `<li>${esc(i)}</li>`).join("") || "<li class='muted'>không khai</li>"}</ul>
      ${card.violations.length ? `<p style="color:var(--bad);font-weight:600">${card.violations.length} vi phạm công cụ trong 7 ngày</p>` : `<p class="note">Không có vi phạm công cụ trong 7 ngày.</p>`}</div></div>
    <h2>KPI 7 ngày</h2><div class="panel scroll">${trend}</div>
    ${recent ? `<h2>Span gần nhất</h2><div class="panel scroll">${recent}</div>` : ""}`;
  }
  return `<h2>Tác nhân trong registry</h2><div class="panel scroll"><table><thead><tr><th>Id</th><th>Loại</th><th>Trạng thái</th><th>Skill</th><th>Mô hình</th></tr></thead><tbody>${rows}</tbody></table></div>${detail}`;
}

// ── Sự cố ────────────────────────────────────────────────────────────────────
async function viewIncidents() {
  const d = await api("/api/incidents");
  const br = d.breakers.length ? d.breakers.map(b => `<tr><td>${esc(b.provider)}</td><td>${pill(b.state, b.state === "CLOSED" ? "ok" : "fail")}</td><td>${esc(b.reason || "–")}</td><td class="num">${b.failures}</td><td class="num">${esc(b.reopen_at ? fmtDateTime(b.reopen_at) : "–")}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">Chưa có breaker nào ghi nhận.</td></tr>`;
  const pr = Object.entries(d.probes).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${pill(v.state === "ok" ? "khoẻ" : "bất thường", v.state === "ok" ? "ok" : "fail")}</td><td class="num">${esc(fmtDateTime(v.since))}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Chưa có phép đo.</td></tr>`;
  const ev = d.events.map(e => `<tr><td class="num">${esc(fmtDateTime(e.ts))}</td><td>${pill(e.level, e.level === "warn" ? "warn" : "fail")}</td><td class="mono">${esc(e.kind)}</td><td>${esc(e.message.slice(0, 220))}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Không có sự kiện cảnh báo gần đây.</td></tr>`;
  const dg = d.diagnoses.map(x => `<li><span class="muted">${esc(x.ts.slice(5, 16).replace("T", " "))}</span> ${esc(x.message)}<br><code>${esc(x.data.command || "none")}</code> ${esc(x.data.rationale || "")}</li>`).join("");
  return `<div class="grid2"><div><h2>Breaker provider</h2><div class="panel scroll"><table><thead><tr><th>Provider</th><th>Trạng thái</th><th>Lý do</th><th>Lỗi</th><th>Mở lại</th></tr></thead><tbody>${br}</tbody></table></div></div>
  <div><h2>Phép đo sức khoẻ</h2><div class="panel scroll"><table><thead><tr><th>Phép đo</th><th>Trạng thái</th><th>Từ</th></tr></thead><tbody>${pr}</tbody></table></div></div></div>
  <h2>Sự kiện cảnh báo trở lên</h2><div class="panel scroll"><table><thead><tr><th>Lúc</th><th>Mức</th><th>Loại</th><th>Nội dung</th></tr></thead><tbody>${ev}</tbody></table></div>
  <h2>Chẩn đoán của ops-sentinel</h2><div class="panel pad">${dg ? `<ul class="plain">${dg}</ul>` : `<span class="muted">Chưa có chẩn đoán nào.</span>`}</div>`;
}

// ── Cải tiến ─────────────────────────────────────────────────────────────────
function spark(series, color) {
  if (series.length < 2) return `<span class="muted">chưa đủ dữ liệu</span>`;
  const w = 220, h = 40, lo = Math.min(...series), hi = Math.max(...series), r = (hi - lo) || 1;
  const pts = series.map((v, i) => `${(i * (w - 6) / (series.length - 1) + 3).toFixed(1)},${(h - 5 - (v - lo) / r * (h - 10)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;max-width:100%" role="img" aria-label="Xu hướng ${series.length} đợt"><polyline class="spark" points="${pts}"/></svg>`;
}
async function viewImprove() {
  const [props, kpi] = await Promise.all([api("/api/improvements"), api("/api/kpi")]);
  const s = kpi.series;
  const label = { first_pass_yield: "Nhận đủ bài lượt đầu", tokens_per_article: "Token mỗi bài", repair_share: "Tỷ lệ token ở bước vá", avg_latency_s: "Độ trễ lô (giây)" };
  const trends = Object.keys(label).map(k => `<div class="panel pad"><h3>${label[k]}</h3>${spark(s[k])}<div class="note">${s[k].length ? "gần nhất " + (k === "first_pass_yield" || k === "repair_share" ? pct(s[k][s[k].length - 1]) : Math.round(s[k][s[k].length - 1])) + " · " + s[k].length + " đợt" : "chưa có đợt DONE có vết"}</div></div>`).join("");
  const cards = props.map(p => `<div class="panel pad" style="margin-bottom:12px"><div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><div style="min-width:0;flex:1"><b>#${p.id} ${esc(p.title)}</b><div class="note">${esc(p.kind)} · tác động ${num(p.impact)} · ${fmtDate(p.created_at)} ${pill(p.status, p.status === "open" ? "warn" : "ok")}${p.story_id ? " · story <code>" + esc(p.story_id) + "</code>" : ""}</div></div>
    ${p.status === "open" ? `<div style="display:flex;gap:6px;align-items:flex-start"><button class="primary" data-prop="${p.id}" data-act="open_story">Mở story</button><button data-prop="${p.id}" data-act="defer">Hoãn</button><button data-prop="${p.id}" data-act="reject">Bác</button></div>` : ""}</div>
    <details data-d="${p.id}" ${sel.open.has(String(p.id)) ? "open" : ""} style="margin-top:8px"><summary class="muted" style="cursor:pointer">Bằng chứng</summary><pre class="mono" style="white-space:pre-wrap;margin:6px 0 0">${esc(JSON.stringify(p.evidence, null, 2))}</pre></details></div>`).join("");
  return `<h2>Hộp thư cải tiến</h2>${cards || `<div class="panel empty">Chưa có đề xuất nào. Bộ phát hiện chạy mỗi giờ trên vết và KPI; đề xuất xuất hiện khi có bằng chứng đủ mạnh.</div>`}
  <p class="note">Đề xuất tự sinh không bao giờ tự thi hành. Chỉ <b>Mở story</b> mới tạo intake và story ở trạng thái <code>planned</code> trong harness.</p>
  <h2>Xu hướng KPI (đợt DONE trong 14 ngày)</h2><div class="grid2">${trends}</div>`;
}

// ── định tuyến, làm mới ──────────────────────────────────────────────────────
const VIEWS = { overview: viewOverview, waves: viewWaves, agents: viewAgents, incidents: viewIncidents, improve: viewImprove };
async function render() {
  if (!L.span_status) { try { L = await api("/api/labels"); } catch (e) { L = {}; } }
  const tab = (location.hash || "#overview").slice(1);
  const fn = VIEWS[tab] || viewOverview;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === (VIEWS[tab] ? tab : "overview")));
  try {
    const [html, st] = await Promise.all([fn(), api("/api/state")]);
    renderStrip(st);
    const y = window.scrollY;
    document.getElementById("view").innerHTML = html;
    window.scrollTo(0, y);
    bind();
  } catch (e) {
    document.getElementById("view").innerHTML = `<div class="panel empty">Không đọc được dữ liệu: ${esc(e.message)}. Daemon có đang chạy không?</div>`;
  }
  lastTab = tab;
}
function bind() {
  document.querySelectorAll("[data-wave]").forEach(el => {
    const go = () => { sel.wave = el.dataset.wave; if ((location.hash || "#overview") !== "#waves") location.hash = "#waves"; else render(); };
    el.addEventListener("click", go); el.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
  document.querySelectorAll("[data-agent]").forEach(el => {
    const go = () => { sel.agent = el.dataset.agent; render(); };
    el.addEventListener("click", go); el.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
  document.querySelectorAll("details[data-d]").forEach(d => d.addEventListener("toggle", () => { d.open ? sel.open.add(d.dataset.d) : sel.open.delete(d.dataset.d); }));
  document.querySelectorAll("[data-prop]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    const r = await post(`/api/improvements/${b.dataset.prop}/${b.dataset.act}`);
    if (r.status !== 200) alert_(r.body.message || r.body.error || "Lỗi");
    render();
  }));
}
function alert_(msg) { const n = document.createElement("div"); n.className = "chip bad"; n.textContent = msg; n.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:9;padding:8px 14px"; document.body.appendChild(n); setTimeout(() => n.remove(), 6000); }
window.addEventListener("hashchange", render);
render();
timer = setInterval(() => { if (!document.hidden) render(); }, 4000);
</script>
